<div>
    <h1>{{title}}</h1>

    <form (ngSubmit)="addstock(stockform)" #stockform="ngForm">
        <!-- <label for="symbol"> Symbol: </label>
        <input name="symbol" required [(ngModel)]="newstock.symbol" />
        <br>
        <label for="name"> Name: </label>
        <input name="name" required [(ngModel)]="newstock.name" />

    <table>
        <tbody>
            <tr>
            <td><label>Symbol:</label></td>
            <td><input name="symbol" required [(ngModel)]="newstock.symbol" /></td>
            </tr>
            <tr>
            <td><label>Name:</label></td>
            <td><input name="name" required [(ngModel)]="newstock.name" /></td>
            </tr>
            <tr>
            <td><label>Shares:</label></td>
            <td><input name="shares" type="number" min="1" required [(ngModel)]="newstock.shares" /></td>
            </tr>
            <tr>
            <td><label for="priceid">Price:</label></td>
            <td><input name="price" id="priceid" type="number" min="0.01" step="0.01" required [(ngModel)]="newstock.price" /></td>
            </tr>
        </tbody>
    </table>
       <button type="submit" (click)="addstock(stockform)">Add Stock</button>
       {{stocks.length}}
       <table *ngIf="stocks.length >0">
        <thead>
            <tr>
                <th>No.</th>
                <th>Symbol</th>
                <th>Name</th>
                <th>Shares</th>
                <th>Price</th>
                <th>Total</th>
            </tr>
         </thead>
         <tbody>
         <tr *ngFor="let x of stocks; let i=index">
             <td>{{i+1}}</td>
             <td>{{x.symbol}}</td>
             <td>{{x.name}}</td>
             <td>{{x.shares}}</td>
             <td>{{x.price}}</td> 
             <td>{{x.shares * x.price}}</td>  
         </tr>
        </tbody>
       </table>
       
   </form>   
</div>
